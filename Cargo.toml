[workspace]
resolver = "2"
members = ["common", "daemon", "tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
md-5 = "0.10"
# keyring has NO default backend feature — without one it silently falls
# back to an in-memory mock store that reports success but persists nothing
# (found by testing an actual save/load round-trip; see common/src/config.rs
# tests and the E2E verification notes). sync-secret-service is the real
# Linux Secret Service (GNOME Keyring/KWallet) backend, matching Entry's
# synchronous API used throughout this project.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

maraetai-common = { path = "common" }
