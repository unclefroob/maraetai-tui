[package]
name = "maraetai-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maraetaid"
path = "src/main.rs"

[dependencies]
maraetai-common.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
zbus.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 0.21+ is required for `DecoderBuilder::with_byte_len` — without a known
# byte length, Symphonia's FLAC seeking fails outright with
# `SeekError::Unseekable` (confirmed against a real FLAC file over a real
# HTTP Range server; WAV seeking worked fine even without it, which is why
# this wasn't caught by the wav-based test in visualizer.rs). This also
# brings a breaking change to f32 samples (was i16), reflected in
# visualizer.rs.
rodio = { version = "=0.21.1", default-features = false, features = ["symphonia-all", "playback"] }
mpris-server = { version = "0.10", features = ["tokio"] }
nix = { version = "0.29", features = ["process", "signal", "fs"] }
rustfft = "6"
rand.workspace = true
